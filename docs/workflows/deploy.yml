name: Deploy to production (manual)
# Runs only when an owner starts it. Needs repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit)
# and CLOUDFLARE_ACCOUNT_ID. Stripe and Brevo keys are Worker secrets set once with `wrangler secret put`; they never live in this repo.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck && npm test && npm run build && npm run guardrails
      - name: Deploy worker and static assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test production
        run: |
          curl -fsS https://elimination.micegoneguide.com/api/health
          curl -fsS -o /dev/null -w "%{http_code}\n" https://elimination.micegoneguide.com/
